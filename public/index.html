<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Motards - Professional Gear</title>
    <style>
        :root {
            --primary: #0A4D5C; /* Teal oficial */
            --accent: #FF3B3B;  /* Rojo principal */
            --dark: #1a1a1a;
            --bg: #f8f9fa;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            scroll-behavior: smooth;
        }

        /* BARRA DE NAVEGACIÓN ESTILO FIGMA */
        nav {
            background: var(--primary);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--white);
            margin-left: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-links button:hover { color: var(--accent); }

        .btn-cart {
            background: var(--accent) !important;
            padding: 8px 15px;
            border-radius: 5px;
        }

        /* SECCIONES */
        .seccion { display: none; min-height: 80vh; }
        .active { display: block; }

        /* HERO / INICIO */
        #inicio {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1558981403-c5f91cbba527?auto=format&fit=crop&q=80&w=1470');
            background-size: cover;
            background-position: center;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #inicio h2 { font-size: 3.5rem; margin-bottom: 10px; }

        /* TIENDA */
        header {
            background: var(--white);
            color: var(--primary);
            padding: 30px;
            text-align: center;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        #lista-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* CARDS */
        .card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { transform: translateY(-10px); }

        .card img { 
            width: 100%; height: 250px; object-fit: cover; 
            filter: brightness(1.05) contrast(1.1); 
        }

        .card-body { padding: 20px; }
        .card-body h3 { color: var(--primary); margin: 0; font-size: 1.3rem; }
        
        .price { 
            font-size: 1.8rem; font-weight: bold; 
            color: var(--dark); margin: 15px 0; 
        }

        .btn-buy {
            background: var(--accent);
            color: var(--white); border: none; width: 100%;
            padding: 15px; border-radius: 8px;
            font-weight: bold; cursor: pointer;
            transition: background 0.3s;
        }

        .btn-buy:hover { background: #e03535; }

        /* CONTACTO */
        .contacto-form {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .contacto-form input, .contacto-form textarea {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid #ddd; border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="mostrarSeccion('inicio')">STRIKE MOTARDS</div>
    <div class="nav-links">
        <button onclick="mostrarSeccion('inicio')">INICIO</button>
        <button onclick="mostrarSeccion('tienda')">TIENDA</button>
        <button onclick="mostrarSeccion('contacto')">CONTACTO</button>
        <button class="btn-cart" onclick="alert('Carrito en desarrollo...')">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<div id="inicio" class="seccion active">
    <h2>SIENTE LA VELOCIDAD</h2>
    <p>Accesorios premium para motociclistas exigentes</p>
    <button class="btn-buy" style="width: 200px;" onclick="mostrarSeccion('tienda')">COMPRAR AHORA</button>
</div>

<div id="tienda" class="seccion">
    <header>
        <h1>CATÁLOGO PROFESIONAL</h1>
        <p>Calidad 4K certificada por Strike Motards</p>
    </header>
    <div class="container">
        <div id="lista-productos"></div>
    </div>
</div>

<div id="contacto" class="seccion">
    <div class="container">
        <div class="contacto-form">
            <h2 style="color: var(--primary); text-align: center;">CONTACTO</h2>
            <input type="text" placeholder="Tu nombre">
            <input type="email" placeholder="Tu correo electrónico">
            <textarea rows="5" placeholder="¿En qué podemos ayudarte?"></textarea>
            <button class="btn-buy" onclick="alert('Mensaje enviado')">ENVIAR MENSAJE</button>
        </div>
    </div>
</div>

<script>
    // 1. NAVEGACIÓN MALEABLE
    function mostrarSeccion(id) {
        document.querySelectorAll('.seccion').forEach(sec => {
            sec.classList.remove('active');
        });
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    // 2. CARRITO INTERACTIVO
    let cartCounter = 0;
    function addCart() {
        cartCounter++;
        document.getElementById('cart-count').innerText = cartCounter;
        // Pequeña animación visual
        const btn = document.getElementById('cart-count');
        btn.style.transform = "scale(1.5)";
        setTimeout(() => btn.style.transform = "scale(1)", 200);
    }

    // 3. CARGA DE PRODUCTOS DESDE SEQUELIZE
    async function cargarProductos() {
        try {
            const res = await fetch('/api/productos');
            const data = await res.json();
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';

            data.forEach(p => {
                contenedor.innerHTML += `
                    <div class="card">
                        <img src="${p.imagen_url || 'https://via.placeholder.com/300'}" alt="${p.nombre}">
                        <div class="card-body">
                            <h3>${p.nombre}</h3>
                            <p style="color: #666; font-size: 0.9rem;">${p.descripcion}</p>
                            <div class="price">$${p.precio}</div>
                            <button class="btn-buy" onclick="addCart()">COMPRAR AHORA</button>
                        </div>
                    </div>`;
            });
        } catch (error) {
            console.error('Error al cargar productos:', error);
        }
    }

    cargarProductos();
</script>

</body>
</html>
