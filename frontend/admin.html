<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin - Strike Motards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#010d1a;
    color:white;
}

/* =========================
LOGIN
========================= */

#loginContainer{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#08243d;
    padding:40px;
    border-radius:20px;
    width:340px;
    box-shadow:0 0 20px rgba(0,217,255,.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#00d9ff;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#d9dee7;
    font-size:15px;
}

.login-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16d2f5;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#00b7d6;
}

/* =========================
PANEL
========================= */

#adminPanel{
    display:none;
    padding:30px;
}

.header-admin{
    background:#021b2f;
    padding:30px;
    border-radius:10px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-admin h1{
    color:#00d9ff;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#08243d;
    padding:25px;
    border-radius:15px;
}

.card h3{
    color:#00d9ff;
    margin-bottom:15px;
}

.card p{
    font-size:55px;
    font-weight:bold;
}/* =========================
SECCIONES
========================= */

.section{
    background:#08243d;
    border-radius:18px;
    padding:25px;
    margin-bottom:30px;
}

.section h2{
    margin-bottom:20px;
    color:#00d9ff;
}

/* =========================
FORMULARIOS
========================= */

.form-admin{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.form-admin input,
.form-admin textarea,
.form-admin select{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#14395e;
    color:white;
    font-size:15px;
}

.form-admin textarea{
    resize:none;
    height:100px;
}

.form-admin button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#16d2f5;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.form-admin button:hover{
    background:#00b7d6;
}

/* =========================
BUSCADOR
========================= */

.filtros-admin{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.filtros-admin input,
.filtros-admin select{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#14395e;
    color:white;
    font-size:15px;
}

.filtros-admin input{
    flex:1;
}

/* =========================
TABLAS
========================= */

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    color:#00d9ff;
    text-align:left;
    padding:18px 15px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

table td{
    padding:18px 15px;
    border-bottom:1px solid rgba(255,255,255,.08);
}.btn-editar{
    background:#16d2f5;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-right:10px;
}

.btn-eliminar{
    background:red;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

/* =========================
ESTADO PEDIDOS
========================= */

.estado-select{
    padding:10px 12px;
    border:none;
    border-radius:10px;
    background:#ffb800;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:768px){

    .header-admin{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }

    table{
        display:block;
        overflow-x:auto;
    }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginContainer">

    <div class="login-box">

        <h2>🔐 Login Administrador</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="loginAdmin()">
            Ingresar
        </button>

    </div>

</div>

<!-- PANEL -->

<div id="adminPanel">

    <div class="header-admin">

        <h1>⚙️ Panel Administrador</h1>

        <h2>Strike Motards</h2>

    </div>

    <!-- CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total de Pedidos</h3>
            <p id="totalPedidos">0</p>
        </div>

        <div class="card">
            <h3>Ventas Totales</h3>
            <p id="ventasTotales">$0</p>
        </div>

        <div class="card">
            <h3>Productos</h3>
            <p id="totalProductos">0</p>
        </div>

    </div>    <!-- GESTIÓN PRODUCTOS -->

    <div class="section">

        <h2>📦 Gestión de Productos</h2>

        <div class="form-admin">

            <input
                type="hidden"
                id="productoId"
            >

            <input
                type="text"
                id="nombreProducto"
                placeholder="Nombre del producto"
            >

            <textarea
                id="descripcionProducto"
                placeholder="Descripción del producto"
            ></textarea>

            <input
                type="number"
                id="precioProducto"
                placeholder="Precio"
            >

            <input
                type="text"
                id="imagenProducto"
                placeholder="URL de imagen"
            >

            <select id="categoriaProducto">

                <option value="">
                    Selecciona categoría
                </option>

                <option value="Cascos">
                    Cascos
                </option>

                <option value="Ropa">
                    Ropa
                </option>

                <option value="Accesorios">
                    Accesorios
                </option>

                <option value="Calzado">
                    Calzado
                </option>

                <option value="Tecnologia">
                    Tecnología
                </option>

            </select>

            <input
                type="number"
                id="stockProducto"
                placeholder="Stock"
            >

            <button
                id="btnGuardarProducto"
                onclick="guardarProducto()"
            >
                Agregar Producto
            </button>

        </div>

    </div>

    <!-- PRODUCTOS -->

    <div class="section">

        <h2>📋 Productos Registrados</h2>

        <!-- BUSCADOR -->

        <div class="filtros-admin">

            <input
                type="text"
                id="buscarProducto"
                placeholder="Buscar producto..."
                oninput="filtrarProductosAdmin()"
            >

            <select
                id="filtroCategoria"
                onchange="filtrarProductosAdmin()"
            >

                <option value="">
                    Todas las categorías
                </option>

                <option value="Cascos">
                    Cascos
                </option>

                <option value="Ropa">
                    Ropa
                </option>

                <option value="Accesorios">
                    Accesorios
                </option>

                <option value="Calzado">
                    Calzado
                </option>

                <option value="Tecnologia">
                    Tecnología
                </option>

            </select>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody id="tablaProductos">

            </tbody>

        </table>

    </div>    <!-- PEDIDOS -->

    <div class="section">

        <h2>🧾 Pedidos Recientes</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Total</th>
                    <th>Estado</th>

                </tr>

            </thead>

            <tbody id="tablaPedidos">

            </tbody>

        </table>

    </div>

</div>

<script>

const API_URL =
    'https://backend-strike-motards.onrender.com';

let productoEditando = null;

let productosAdmin = [];

/* =========================
LOGIN ADMIN
========================= */

function loginAdmin(){

    const usuario =
        document.getElementById('usuario').value.trim();

    const password =
        document.getElementById('password').value.trim();

    if(usuario === 'admin' && password === 'geramx'){

        document.getElementById('loginContainer')
            .style.display = 'none';

        document.getElementById('adminPanel')
            .style.display = 'block';

        cargarResumen();
        cargarProductos();
        cargarPedidos();

    }else{

        alert('Usuario o contraseña incorrectos');

    }

}

/* =========================
CARGAR RESUMEN
========================= */

async function cargarResumen(){

    try{

        const respuesta =
            await fetch(`${API_URL}/admin/resumen`);

        const data =
            await respuesta.json();

        document.getElementById('totalPedidos')
            .textContent =
            data.totalPedidos;

        document.getElementById('ventasTotales')
            .textContent =
            `$${Number(data.totalVentas)
                .toLocaleString('es-MX')}`;

        document.getElementById('totalProductos')
            .textContent =
            data.totalProductos;

    }catch(error){

        console.error(
            'Error cargando resumen:',
            error
        );

    }

}/* =========================
CARGAR PRODUCTOS
========================= */

async function cargarProductos(){

    try{

        const respuesta =
            await fetch(`${API_URL}/productos`);

        const productos =
            await respuesta.json();

        productosAdmin = productos;

        renderizarProductosAdmin(productos);

    }catch(error){

        console.error(
            'Error cargando productos:',
            error
        );

    }

}

/* =========================
RENDER PRODUCTOS
========================= */

function renderizarProductosAdmin(productos){

    const tabla =
        document.getElementById('tablaProductos');

    tabla.innerHTML = '';

    productos.forEach(producto => {

        tabla.innerHTML += `
            <tr>

                <td>
                    #${producto.id}
                </td>

                <td>
                    ${producto.nombre}
                </td>

                <td>
                    ${producto.categoria}
                </td>

                <td>
                    $${Number(producto.precio)
                        .toLocaleString('es-MX')}
                </td>

                <td>
                    ${producto.stock}
                </td>

                <td>

                    <button
                        class="btn-editar"
                        onclick='editarProducto(${JSON.stringify(producto)})'
                    >
                        Editar
                    </button>

                    <button
                        class="btn-eliminar"
                        onclick="eliminarProducto(${producto.id})"
                    >
                        Eliminar
                    </button>

                </td>

            </tr>
        `;

    });

}

/* =========================
FILTRAR PRODUCTOS
========================= */

function filtrarProductosAdmin(){

    const texto =
        document.getElementById('buscarProducto')
            .value
            .toLowerCase();

    const categoria =
        document.getElementById('filtroCategoria')
            .value;

    const filtrados =
        productosAdmin.filter(producto => {

            const coincideTexto =
                producto.nombre
                    .toLowerCase()
                    .includes(texto);

            const coincideCategoria =
                categoria === '' ||
                producto.categoria === categoria;

            return coincideTexto &&
                   coincideCategoria;

        });

    renderizarProductosAdmin(filtrados);

}/* =========================
CARGAR PEDIDOS
========================= */

async function cargarPedidos(){

    try{

        const respuesta =
            await fetch(`${API_URL}/pedidos`);

        const pedidos =
            await respuesta.json();

        const tabla =
            document.getElementById('tablaPedidos');

        tabla.innerHTML = '';

        pedidos.forEach(pedido => {

            tabla.innerHTML += `
                <tr>

                    <td>
                        #${pedido.id}
                    </td>

                    <td>
                        ${pedido.nombre_cliente}
                    </td>

                    <td>
                        ${pedido.telefono}
                    </td>

                    <td>
                        ${pedido.direccion}
                    </td>

                    <td>
                        $${Number(pedido.total)
                            .toLocaleString('es-MX')}
                    </td>

                    <td>

                        <select
                            class="estado-select"
                            onchange="cambiarEstadoPedido(${pedido.id}, this.value)"
                        >

                            <option
                                value="Pendiente"
                                ${pedido.estado === 'Pendiente' ? 'selected' : ''}
                            >
                                Pendiente
                            </option>

                            <option
                                value="Enviado"
                                ${pedido.estado === 'Enviado' ? 'selected' : ''}
                            >
                                Enviado
                            </option>

                            <option
                                value="Entregado"
                                ${pedido.estado === 'Entregado' ? 'selected' : ''}
                            >
                                Entregado
                            </option>

                            <option
                                value="Cancelado"
                                ${pedido.estado === 'Cancelado' ? 'selected' : ''}
                            >
                                Cancelado
                            </option>

                        </select>

                    </td>

                </tr>
            `;

        });

    }catch(error){

        console.error(
            'Error cargando pedidos:',
            error
        );

    }

}

/* =========================
CAMBIAR ESTADO PEDIDO
========================= */

async function cambiarEstadoPedido(id, estado){

    try{

        const respuesta =
            await fetch(`${API_URL}/admin/pedidos/${id}/estado`, {
                method:'PUT',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({ estado })
            });

        const data =
            await respuesta.json();

        if(!respuesta.ok){
            alert(data.error || 'Error al cambiar estado');
            return;
        }

        cargarPedidos();

    }catch(error){

        console.error(
            'Error cambiando estado:',
            error
        );

        alert('Error al cambiar estado');

    }

}/* =========================
GUARDAR PRODUCTO
========================= */

async function guardarProducto(){

    const producto = {
        nombre:
            document.getElementById('nombreProducto')
                .value
                .trim(),

        descripcion:
            document.getElementById('descripcionProducto')
                .value
                .trim(),

        precio:
            Number(
                document.getElementById('precioProducto')
                    .value
            ),

        imagen_url:
            document.getElementById('imagenProducto')
                .value
                .trim(),

        categoria:
            document.getElementById('categoriaProducto')
                .value,

        stock:
            Number(
                document.getElementById('stockProducto')
                    .value
            )
    };

    if(
        !producto.nombre ||
        !producto.precio ||
        !producto.categoria
    ){
        alert('Completa nombre, precio y categoría');
        return;
    }

    try{

        let url =
            `${API_URL}/admin/productos`;

        let metodo =
            'POST';

        if(productoEditando){

            url =
                `${API_URL}/admin/productos/${productoEditando}`;

            metodo =
                'PUT';

        }

        const respuesta =
            await fetch(url, {
                method:metodo,
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify(producto)
            });

        const data =
            await respuesta.json();

        if(!respuesta.ok){
            alert(data.error || 'Error al guardar producto');
            return;
        }

        alert(
            productoEditando
                ? 'Producto actualizado correctamente'
                : 'Producto agregado correctamente'
        );

        limpiarFormulario();

        cargarProductos();
        cargarResumen();

    }catch(error){

        console.error(
            'Error guardando producto:',
            error
        );

        alert('Error al guardar producto');

    }

}

/* =========================
EDITAR PRODUCTO
========================= */

function editarProducto(producto){

    productoEditando =
        producto.id;

    document.getElementById('nombreProducto').value =
        producto.nombre;

    document.getElementById('descripcionProducto').value =
        producto.descripcion || '';

    document.getElementById('precioProducto').value =
        producto.precio;

    document.getElementById('imagenProducto').value =
        producto.imagen_url || '';

    document.getElementById('categoriaProducto').value =
        producto.categoria;

    document.getElementById('stockProducto').value =
        producto.stock;

    document.getElementById('btnGuardarProducto').textContent =
        'Actualizar Producto';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}/* =========================
ELIMINAR PRODUCTO
========================= */

async function eliminarProducto(id){

    const confirmar =
        confirm('¿Seguro que deseas eliminar este producto?');

    if(!confirmar){
        return;
    }

    try{

        const respuesta =
            await fetch(`${API_URL}/admin/productos/${id}`, {
                method:'DELETE'
            });

        const data =
            await respuesta.json();

        if(!respuesta.ok){
            alert(data.error || 'Error al eliminar producto');
            return;
        }

        alert('Producto eliminado correctamente');

        cargarProductos();
        cargarResumen();

    }catch(error){

        console.error(
            'Error eliminando producto:',
            error
        );

        alert('Error al eliminar producto');

    }

}

/* =========================
LIMPIAR FORMULARIO
========================= */

function limpiarFormulario(){

    productoEditando = null;

    document.getElementById('nombreProducto').value = '';
    document.getElementById('descripcionProducto').value = '';
    document.getElementById('precioProducto').value = '';
    document.getElementById('imagenProducto').value = '';
    document.getElementById('categoriaProducto').value = '';
    document.getElementById('stockProducto').value = '';

    document.getElementById('btnGuardarProducto').textContent =
        'Agregar Producto';

}

</script>

</body>
</html>
