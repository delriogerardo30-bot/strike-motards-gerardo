<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin - Strike Motards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#010d1a;
    color:white;
}

/* =========================
LOGIN
========================= */

#loginContainer{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#08243d;
    padding:40px;
    border-radius:20px;
    width:340px;
    box-shadow:0 0 20px rgba(0,217,255,.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#00d9ff;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#d9dee7;
    font-size:15px;
}

.login-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16d2f5;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#00b7d6;
}

/* =========================
PANEL
========================= */

#adminPanel{
    display:none;
    padding:30px;
}

.header-admin{
    background:#021b2f;
    padding:30px;
    border-radius:10px;
    margin-bottom:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-admin h1{
    color:#00d9ff;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#08243d;
    padding:25px;
    border-radius:15px;
}

.card h3{
    color:#00d9ff;
    margin-bottom:15px;
}

.card p{
    font-size:55px;
    font-weight:bold;
}

/* =========================
FORM PRODUCTOS
========================= */

.form-producto{
    background:#08243d;
    padding:25px;
    border-radius:15px;
    margin-bottom:30px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.form-producto h2{
    color:#00d9ff;
}

.form-producto input,
.form-producto textarea,
.form-producto select{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#0f3558;
    color:white;
    font-size:15px;
}

.form-producto textarea{
    resize:none;
    height:100px;
}

.form-producto button{
    background:#00d9ff;
    color:black;
    padding:14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.form-producto button:hover{
    background:#00b7d6;
}

/* =========================
TABLAS
========================= */

.tabla-container{
    background:#08243d;
    padding:20px;
    border-radius:15px;
    margin-bottom:30px;
}

.tabla-container h2{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    color:#00d9ff;
    text-align:left;
    padding:15px;
}

td{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.1);
}

.estado{
    background:#ffb800;
    color:black;
    padding:8px 15px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}

.btn-eliminar{
    background:red;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

.btn-editar{
    background:#00d9ff;
    color:black;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    margin-right:10px;
}

</style>
</head>

<body>

<!-- =========================
LOGIN
========================= -->

<div id="loginContainer">

    <div class="login-box">

        <h2>🔐 Login Administrador</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Usuario"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="loginAdmin()">
            Ingresar
        </button>

    </div>

</div>

<!-- =========================
PANEL ADMIN
========================= -->

<div id="adminPanel">

    <div class="header-admin">

        <h1>⚙ Panel Administrador</h1>

        <h2>Strike Motards</h2>

    </div>

    <!-- CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total de Pedidos</h3>
            <p id="totalPedidos">0</p>
        </div>

        <div class="card">
            <h3>Ventas Totales</h3>
            <p id="ventasTotales">$0</p>
        </div>

        <div class="card">
            <h3>Productos</h3>
            <p id="totalProductos">0</p>
        </div>

    </div>    <!-- FORMULARIO PRODUCTOS -->

    <div class="form-producto">

        <h2>📦 Gestión de Productos</h2>

        <input
            type="hidden"
            id="productoId"
        >

        <input
            type="text"
            id="nombreProducto"
            placeholder="Nombre del producto"
        >

        <textarea
            id="descripcionProducto"
            placeholder="Descripción del producto"
        ></textarea>

        <input
            type="number"
            id="precioProducto"
            placeholder="Precio"
        >

        <input
            type="text"
            id="imagenProducto"
            placeholder="URL de imagen"
        >

        <select id="categoriaProducto">

            <option value="">
                Selecciona categoría
            </option>

            <option value="Cascos">
                Cascos
            </option>

            <option value="Ropa">
                Ropa
            </option>

            <option value="Accesorios">
                Accesorios
            </option>

            <option value="Calzado">
                Calzado
            </option>

            <option value="Tecnología">
                Tecnología
            </option>

        </select>

        <input
            type="number"
            id="stockProducto"
            placeholder="Stock"
        >

        <button onclick="guardarProducto()" id="btnGuardarProducto">
            Agregar Producto
        </button>

    </div>

    <!-- TABLA PRODUCTOS -->

    <div class="tabla-container">

        <h2>📋 Productos Registrados</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>

            </thead>

            <tbody id="tablaProductos">
            </tbody>

        </table>

    </div>

    <!-- TABLA PEDIDOS -->

    <div class="tabla-container">

        <h2>🧾 Pedidos Recientes</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Total</th>
                    <th>Estado</th>
                </tr>

            </thead>

            <tbody id="tablaPedidos">
            </tbody>

        </table>

    </div>

</div><script>

const API_URL = 'https://backend-strike-motards.onrender.com';

/* =========================
LOGIN ADMIN
========================= */

function loginAdmin(){

    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value.trim();

    if(usuario === 'admin' && password === 'geramx'){

        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';

        cargarResumen();
        cargarProductos();
        cargarPedidos();

    }else{
        alert('Usuario o contraseña incorrectos');
    }
}

/* =========================
CARGAR RESUMEN
========================= */

async function cargarResumen(){

    try{

        const respuesta = await fetch(`${API_URL}/admin/resumen`);
        const data = await respuesta.json();

        document.getElementById('totalPedidos').textContent =
            data.totalPedidos;

        document.getElementById('ventasTotales').textContent =
            `$${Number(data.totalVentas).toLocaleString('es-MX')}`;

        document.getElementById('totalProductos').textContent =
            data.totalProductos;

    }catch(error){
        console.error('Error cargando resumen:', error);
    }
}

/* =========================
CARGAR PRODUCTOS
========================= */

async function cargarProductos(){

    try{

        const respuesta = await fetch(`${API_URL}/productos`);
        const productos = await respuesta.json();

        const tabla = document.getElementById('tablaProductos');

        tabla.innerHTML = '';

        productos.forEach(producto => {

            tabla.innerHTML += `
                <tr>
                    <td>#${producto.id}</td>
                    <td>${producto.nombre}</td>
                    <td>${producto.categoria}</td>
                    <td>$${Number(producto.precio).toLocaleString('es-MX')}</td>
                    <td>${producto.stock}</td>
                    <td>
                        <button
                            class="btn-editar"
                            onclick='editarProducto(${JSON.stringify(producto)})'
                        >
                            Editar
                        </button>

                        <button
                            class="btn-eliminar"
                            onclick="eliminarProducto(${producto.id})"
                        >
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;

        });

    }catch(error){
        console.error('Error cargando productos:', error);
    }
}/* =========================
CARGAR PEDIDOS
========================= */

async function cargarPedidos(){

    try{

        const respuesta = await fetch(`${API_URL}/pedidos`);
        const pedidos = await respuesta.json();

        const tabla = document.getElementById('tablaPedidos');

        tabla.innerHTML = '';

        pedidos.forEach(pedido => {

            tabla.innerHTML += `
                <tr>
                    <td>#${pedido.id}</td>
                    <td>${pedido.nombre_cliente}</td>
                    <td>${pedido.telefono}</td>
                    <td>${pedido.direccion}</td>
                    <td>$${Number(pedido.total).toLocaleString('es-MX')}</td>
                    <td>
                        <span class="estado">
                            ${pedido.estado}
                        </span>
                    </td>
                </tr>
            `;

        });

    }catch(error){
        console.error('Error cargando pedidos:', error);
    }
}

/* =========================
GUARDAR PRODUCTO
========================= */

async function guardarProducto(){

    const id = document.getElementById('productoId').value;

    const producto = {
        nombre: document.getElementById('nombreProducto').value.trim(),
        descripcion: document.getElementById('descripcionProducto').value.trim(),
        precio: Number(document.getElementById('precioProducto').value),
        imagen_url: document.getElementById('imagenProducto').value.trim(),
        categoria: document.getElementById('categoriaProducto').value,
        stock: Number(document.getElementById('stockProducto').value)
    };

    if(!producto.nombre || !producto.precio || !producto.categoria){
        alert('Completa nombre, precio y categoría');
        return;
    }

    try{

        let url = `${API_URL}/admin/productos`;
        let metodo = 'POST';

        if(id){
            url = `${API_URL}/admin/productos/${id}`;
            metodo = 'PUT';
        }

        const respuesta = await fetch(url, {
            method: metodo,
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(producto)
        });

        const data = await respuesta.json();

        if(!respuesta.ok){
            alert(data.error || 'Error al guardar producto');
            return;
        }

        alert(id ? 'Producto actualizado' : 'Producto agregado');

        limpiarFormularioProducto();

        cargarProductos();
        cargarResumen();

    }catch(error){
        console.error('Error guardando producto:', error);
        alert('Error al guardar producto');
    }
}/* =========================
EDITAR PRODUCTO
========================= */

function editarProducto(producto){

    document.getElementById('productoId').value =
        producto.id;

    document.getElementById('nombreProducto').value =
        producto.nombre;

    document.getElementById('descripcionProducto').value =
        producto.descripcion || '';

    document.getElementById('precioProducto').value =
        producto.precio;

    document.getElementById('imagenProducto').value =
        producto.imagen_url || '';

    document.getElementById('categoriaProducto').value =
        producto.categoria;

    document.getElementById('stockProducto').value =
        producto.stock;

    document.getElementById('btnGuardarProducto').textContent =
        'Actualizar Producto';

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

/* =========================
ELIMINAR PRODUCTO
========================= */

async function eliminarProducto(id){

    const confirmar =
        confirm('¿Seguro que deseas eliminar este producto?');

    if(!confirmar){
        return;
    }

    try{

        const respuesta =
            await fetch(`${API_URL}/admin/productos/${id}`, {
                method:'DELETE'
            });

        const data =
            await respuesta.json();

        if(!respuesta.ok){
            alert(data.error || 'Error al eliminar producto');
            return;
        }

        alert('Producto eliminado correctamente');

        cargarProductos();
        cargarResumen();

    }catch(error){
        console.error('Error eliminando producto:', error);
        alert('Error al eliminar producto');
    }
}

/* =========================
LIMPIAR FORMULARIO
========================= */

function limpiarFormularioProducto(){

    document.getElementById('productoId').value = '';
    document.getElementById('nombreProducto').value = '';
    document.getElementById('descripcionProducto').value = '';
    document.getElementById('precioProducto').value = '';
    document.getElementById('imagenProducto').value = '';
    document.getElementById('categoriaProducto').value = '';
    document.getElementById('stockProducto').value = '';

    document.getElementById('btnGuardarProducto').textContent =
        'Agregar Producto';
}

</script>

</body>
</html>
