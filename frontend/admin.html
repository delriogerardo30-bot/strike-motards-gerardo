<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Admin - Strike Motards</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000c18;
            color:white;
        }

        /* =========================
           LOGIN
        ========================== */

        .login-container{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:#000c18;
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:9999;
        }

        .login-box{
            background:#07233d;
            padding:40px;
            border-radius:15px;
            width:350px;
            display:flex;
            flex-direction:column;
            gap:15px;
            box-shadow:0 0 20px rgba(0,255,255,0.2);
        }

        .login-box h2{
            color:#00d9ff;
            text-align:center;
        }

        .login-box input{
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:16px;
        }

        .login-box button{
            padding:12px;
            border:none;
            border-radius:8px;
            background:#00d9ff;
            color:black;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .login-box button:hover{
            background:white;
        }

        #errorLogin{
            color:red;
            text-align:center;
        }

        /* =========================
           PANEL
        ========================== */

        .header{
            background:#02192c;
            padding:30px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .header h1{
            color:#00d9ff;
        }

        .container{
            padding:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#07233d;
            padding:25px;
            border-radius:15px;
        }

        .card h3{
            color:#00d9ff;
            margin-bottom:15px;
        }

        .card p{
            font-size:50px;
            font-weight:bold;
        }

        .tabla-container{
            background:#07233d;
            padding:20px;
            border-radius:15px;
            overflow:auto;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th{
            color:#00d9ff;
            text-align:left;
            padding:15px;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        td{
            padding:15px;
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .estado{
            padding:8px 15px;
            border-radius:20px;
            font-size:14px;
            font-weight:bold;
            display:inline-block;
        }

        .pendiente{
            background:#ffb300;
            color:black;
        }

        .completado{
            background:#00c853;
            color:white;
        }

    </style>

</head>

<body>

    <!-- LOGIN -->

    <div id="loginContainer" class="login-container">

        <div class="login-box">

            <h2>🔐 Login Administrador</h2>

            <input type="text"
                   id="usuario"
                   placeholder="Usuario">

            <input type="password"
                   id="password"
                   placeholder="Contraseña">

            <button onclick="loginAdmin()">
                Ingresar
            </button>

            <p id="errorLogin"></p>

        </div>

    </div>

    <!-- PANEL -->

    <div class="container"
         id="panelAdmin"
         style="display:none;">

        <div class="header">

            <h1>⚙ Panel Administrador</h1>

            <h2>Strike Motards</h2>

        </div>

        <br>

        <div class="cards">

            <div class="card">
                <h3>Total de Pedidos</h3>
                <p id="totalPedidos">0</p>
            </div>

            <div class="card">
                <h3>Ventas Totales</h3>
                <p id="ventasTotales">$0</p>
            </div>

            <div class="card">
                <h3>Productos</h3>
                <p id="totalProductos">0</p>
            </div>

        </div>

        <div class="tabla-container">

            <h1>Pedidos Recientes</h1>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>

                </thead>

                <tbody id="tablaPedidos">                </tbody>

            </table>

        </div>

    </div>

    <script>

        /* =========================
           LOGIN ADMIN
        ========================== */

        function loginAdmin(){

            const usuario =
                document.getElementById('usuario').value;

            const password =
                document.getElementById('password').value;

            if(
                usuario === 'admin' &&
                password === 'geramx'
            ){

                document.getElementById('loginContainer')
                    .style.display = 'none';

                document.getElementById('panelAdmin')
                    .style.display = 'block';

                cargarResumen();
                cargarPedidos();

            }else{

                document.getElementById('errorLogin')
                    .textContent =
                    'Usuario o contraseña incorrectos';

            }

        }

        /* =========================
           CARGAR RESUMEN
        ========================== */

        async function cargarResumen(){

            try{

                const respuesta =
                    await fetch(
                        'https://backend-strike-motards.onrender.com/admin/resumen'
                    );

                const data =
                    await respuesta.json();

                document.getElementById('totalPedidos')
                    .textContent =
                    data.totalPedidos;

                document.getElementById('ventasTotales')
                    .textContent =
                    `$${Number(data.totalVentas).toLocaleString()}`;

                document.getElementById('totalProductos')
                    .textContent =
                    data.totalProductos;

            }catch(error){

                console.error(
                    'Error cargando resumen:',
                    error
                );

            }

        }

        /* =========================
           CARGAR PEDIDOS
        ========================== */

        async function cargarPedidos(){

            try{

                const respuesta =
                    await fetch(
                        'https://backend-strike-motards.onrender.com/pedidos'
                    );

                const pedidos =
                    await respuesta.json();

                const tabla =
                    document.getElementById('tablaPedidos');

                tabla.innerHTML = '';

                pedidos.forEach(pedido => {

                    let claseEstado =
                        'pendiente';

                    if(
                        pedido.estado === 'Completado'
                    ){
                        claseEstado = 'completado';
                    }

                    tabla.innerHTML += `
                        <tr>

                            <td>
                                #${pedido.id}
                            </td>

                            <td>
                                ${pedido.nombre_cliente}
                            </td>

                            <td>
                                ${pedido.telefono}
                            </td>

                            <td>
                                ${pedido.direccion}
                            </td>

                            <td>
                                $${Number(pedido.total).toLocaleString()}
                            </td>

                            <td>

                                <span class="estado ${claseEstado}">
                                    ${pedido.estado}
                                </span>

                            </td>

                        </tr>
                    `;

                });

            }catch(error){

                console.error(
                    'Error cargando pedidos:',
                    error
                );

            }

        }

    </script>

</body>
</html>
