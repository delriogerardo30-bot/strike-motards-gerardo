<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Strike Motards</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#07131d;
      color:white;
    }

    .header{
      width:100%;
      padding:20px 40px;
      background:#081b29;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .header h1{
      color:#00e0ff;
    }

    .container{
      padding:30px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:#0d2436;
      padding:25px;
      border-radius:15px;
      box-shadow:0 0 10px rgba(0,0,0,0.4);
    }

    .card h2{
      font-size:18px;
      margin-bottom:10px;
      color:#00e0ff;
    }

    .card p{
      font-size:30px;
      font-weight:bold;
    }

    .tabla-contenedor{
      background:#0d2436;
      padding:20px;
      border-radius:15px;
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th, td{
      padding:15px;
      text-align:left;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    th{
      background:#102c44;
      color:#00e0ff;
    }

    tr:hover{
      background:#132f47;
    }

    .estado{
      padding:5px 10px;
      border-radius:10px;
      font-size:12px;
      font-weight:bold;
    }

    .pendiente{
      background:orange;
      color:black;
    }

    .completado{
      background:limegreen;
      color:white;
    }

    .cancelado{
      background:red;
      color:white;
    }

  </style>
</head>

<body>

  <div class="header">
    <h1>⚙ Panel Administrador</h1>
    <h2>Strike Motards</h2>
  </div>

  <div class="container">

    <div class="cards">

      <div class="card">
        <h2>Total de Pedidos</h2>
        <p id="totalPedidos">0</p>
      </div>

      <div class="card">
        <h2>Ventas Totales</h2>
        <p id="ventasTotales">$0</p>
      </div>

      <div class="card">
        <h2>Productos</h2>
        <p id="totalProductos">0</p>
      </div>

    </div>

    <div class="tabla-contenedor">

      <h2>Pedidos Recientes</h2>

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Total</th>
            <th>Estado</th>
          </tr>
        </thead>

        <tbody id="tablaPedidos">        </tbody>

      </table>

    </div>

  </div>

  <script>

    async function cargarResumen() {

      try {

        const respuesta = await fetch('https://backend-strike-motards.onrender.com/admin/resumen')

        const data = await respuesta.json();

        document.getElementById('totalPedidos').textContent = data.totalPedidos;

        document.getElementById('ventasTotales').textContent =
          `$${Number(data.totalVentas).toLocaleString()}`;

        document.getElementById('totalProductos').textContent =
          data.totalProductos;

      } catch (error) {

        console.error('Error cargando resumen:', error);

      }

    }

    async function cargarPedidos() {

      try {

        const respuesta = await fetch('https://backend-strike-motards.onrender.com/pedidos')

        const pedidos = await respuesta.json();

        const tabla = document.getElementById('tablaPedidos');

        tabla.innerHTML = '';

        pedidos.forEach(pedido => {

          let claseEstado = 'pendiente';

          if (pedido.estado === 'Completado') {
            claseEstado = 'completado';
          }

          if (pedido.estado === 'Cancelado') {
            claseEstado = 'cancelado';
          }

          tabla.innerHTML += `
            <tr>
              <td>${pedido.id}</td>
              <td>${pedido.nombre_cliente}</td>
              <td>${pedido.telefono}</td>
              <td>${pedido.direccion}</td>
              <td>$${Number(pedido.total).toLocaleString()}</td>

              <td>
                <span class="estado ${claseEstado}">
                  ${pedido.estado}
                </span>
              </td>

            </tr>
          `;

        });

      } catch (error) {

        console.error('Error cargando pedidos:', error);

      }

    }

    cargarResumen();
    cargarPedidos();

  </script>

</body>
</html>
