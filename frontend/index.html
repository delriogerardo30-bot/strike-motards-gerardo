<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Motards | Premium Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A4D5C;
            --dark: #062D38;
            --accent: #FF3B3B;
            --teal: #00D4C8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: white;
        }

        nav {
            background: var(--dark);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 1.9rem; font-weight: 900; }

        .btn-cart {
            background: var(--accent);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seccion { display: none; }
        .active { display: block; }

        /* ==================== CARRITO ESTILO FIGMA ==================== */
        #cart-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .cart-content {
            background: #062D38;
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            border-radius: 16px;
            display: flex;
            overflow: hidden;
        }

        .cart-left {
            flex: 2;
            padding: 30px;
            overflow-y: auto;
        }

        .cart-right {
            flex: 1;
            background: #0A3D4A;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #1a4d5c;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #062D38;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background: #1a4d5c;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">STRIKE MOTARDS</div>
    <div>
        <button onclick="mostrarSeccion('inicio')">INICIO</button>
        <button onclick="mostrarSeccion('tienda')">CATÁLOGO</button>
        <button class="btn-cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<!-- CARRITO ESTILO FIGMA -->
<div id="cart-modal">
    <div class="cart-content">
        <!-- Izquierda: Productos -->
        <div class="cart-left">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Carrito de Compras</h2>
                <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:28px; cursor:pointer;">✕</button>
            </div>
            <div id="cart-list"></div>
        </div>

        <!-- Derecha: Resumen -->
        <div class="cart-right">
            <h2>Resumen del Pedido</h2>
            <div style="margin-top:30px; flex-grow:1;">
                <div style="display:flex; justify-content:space-between; margin:15px 0;">
                    <span>Subtotal</span>
                    <span id="subtotal">$0</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin:15px 0;">
                    <span>Envío</span>
                    <span style="color:#00ff9d;">Gratis</span>
                </div>
            </div>
            <div style="border-top:2px solid #1a4d5c; padding-top:20px; margin-top:auto;">
                <div style="display:flex; justify-content:space-between; font-size:1.4rem; font-weight:700;">
                    <span>Total</span>
                    <span id="cart-total" style="color:var(--accent);">$0</span>
                </div>
            </div>
            <button onclick="showCheckout()" style="width:100%; margin-top:20px; padding:16px; background:var(--accent); border:none; color:white; font-weight:700; border-radius:12px; font-size:1.1rem;">
                Proceder al Pago
            </button>
            <button onclick="clearCart()" style="width:100%; margin-top:10px; padding:14px; background:#1a4d5c; border:none; color:white; border-radius:12px;">
                Vaciar Carrito
            </button>
        </div>
    </div>
</div>

<!-- Resto de tu página (hero y tienda) -->
<div id="inicio" class="seccion active">
    <h1>SIENTE LA VELOCIDAD</h1>
    <p>Equipamiento de alto rendimiento para el asfalto.</p>
    <button onclick="mostrarSeccion('tienda')" style="padding:16px 40px; background:var(--accent); border:none; border-radius:50px; color:white; font-size:1.1rem;">
        EXPLORAR TIENDA
    </button>
</div>

<div id="tienda" class="seccion">
    <!-- Tu catálogo actual -->
    <h1 style="text-align:center; font-size:2.8rem; margin-bottom:10px;">CATÁLOGO PREMIUM</h1>
    <p style="text-align:center; color:#aaa; margin-bottom:40px;">Equipamiento profesional para motards</p>

    <div class="catalog-container">
        <div class="filters-sidebar">
            <h3 style="color:var(--teal);">Categorías</h3>
            <div id="category-filters"></div>
        </div>
        <div style="flex:1">
            <input type="text" id="search-input" placeholder="Buscar productos..." style="width:100%; padding:15px; background:#0A3D4A; border:none; border-radius:12px; color:white; margin-bottom:30px;">
            <div class="products-grid" id="lista-productos"></div>
        </div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
