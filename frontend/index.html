<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Motards | Premium Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tu paleta oficial Strike Motards */
            --primary: #0A4D5C; 
            --primary-dark: #083B47;
            --accent: #FF3B3B;  
            --accent-hover: #E63535;
            --white: #ffffff;
            --zinc-300: #d4d4d8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--primary); /* Fondo Teal como en Figma */
            color: var(--white);
            margin: 0; 
            scroll-behavior: smooth;
        }

        /* Nav Estilo Premium */
        nav {
            background: rgba(10, 77, 92, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { 
            font-size: 1.6rem; 
            font-weight: 900; 
            letter-spacing: -1px;
            cursor: pointer;
            color: var(--white);
        }

        .nav-links button { 
            background: none; border: none; color: var(--white); 
            margin-left: 20px; font-weight: 600; cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-cart { 
            background: var(--accent) !important; 
            padding: 8px 18px; 
            border-radius: 50px; /* Estilo píldora */
            color: white; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Secciones */
        .seccion { display: none; min-height: 80vh; padding-top: 20px; }
        .active { display: block; }

        /* Hero Section */
        #inicio {
            background: linear-gradient(rgba(10, 77, 92, 0.7), rgba(10, 77, 92, 0.9)), 
                        url('https://images.unsplash.com/photo-1558981403-c5f91cbba527?auto=format&fit=crop&q=80&w=1470');
            background-size: cover; background-position: center;
            height: 90vh; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center;
        }

        #inicio h2 { font-size: 3.5rem; margin-bottom: 10px; font-weight: 900; }

        /* GRID DE PRODUCTOS 4K STYLE */
        #lista-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 40px 5%;
        }

        .card {
            background: var(--primary-dark);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { transform: scale(1.03); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

        .card img { width: 100%; height: 280px; object-fit: cover; }

        .card-content { padding: 20px; }

        .category-badge {
            background: rgba(255, 59, 59, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card h3 { margin: 15px 0 5px; font-size: 1.3rem; }
        .card p { color: var(--zinc-300); font-size: 0.9rem; line-height: 1.4; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .price-box .price { font-size: 1.6rem; font-weight: 800; color: var(--white); }
        .price-box .currency { font-size: 0.8rem; color: var(--accent); margin-left: 4px; }

        .btn-add-circle {
            background: var(--accent);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-add-circle:hover { background: var(--accent-hover); }

        /* Modal del Carrito Lateral */
        #cart-modal {
            display: none;
            position: fixed;
            right: 0; top: 0;
            width: 100%; max-width: 400px; height: 100%;
            background: #08333d;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 2000;
            padding: 30px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0;
        }

        .btn-checkout {
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="mostrarSeccion('inicio')">STRIKE MOTARDS</div>
    <div class="nav-links">
        <button onclick="mostrarSeccion('inicio')">INICIO</button>
        <button onclick="mostrarSeccion('tienda')">TIENDA</button>
        <button class="btn-cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<div id="cart-modal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">Tu Equipo</h2>
        <button onclick="toggleCart()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">✕</button>
    </div>
    <div id="cart-list" style="margin-top: 20px;"></div>
    <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 1.2rem;">
            <span>Total:</span>
            <span style="font-weight: 800; color: var(--accent);">$<span id="cart-total">0.00</span></span>
        </div>
        <button class="btn-checkout" onclick="sendWhatsApp()">FINALIZAR POR WHATSAPP</button>
    </div>
</div>

<div id="inicio" class="seccion active">
    <h2>SIENTE LA VELOCIDAD</h2>
    <p style="font-size: 1.2rem; margin-bottom: 30px; opacity: 0.8;">Equipamiento de alto rendimiento para el asfalto.</p>
    <button class="btn-checkout" style="width: 250px;" onclick="mostrarSeccion('tienda')">EXPLORAR TIENDA</button>
</div>

<div id="tienda" class="seccion">
    <header style="text-align: center; padding: 40px 20px;">
        <h1 style="font-size: 2.5rem; margin: 0;">EQUIPAMIENTO PROFESIONAL</h1>
        <p style="color: var(--zinc-300);">Seleccionado para tu seguridad</p>
    </header>
    <div id="lista-productos"></div>
</div>

<script src="index.js"></script>

<script>
    function mostrarSeccion(id) {
        document.querySelectorAll('.seccion').forEach(sec => sec.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
        if(id === 'tienda') cargarProductos();
    }

    function toggleCart() {
        const cart = document.getElementById('cart-modal');
        cart.style.display = cart.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
