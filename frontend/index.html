<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Motards | Premium Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A4D5C;
            --dark: #062D38;
            --accent: #FF3B3B;
            --teal: #00D4C8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: white;
            line-height: 1.6;
        }

        nav {
            background: var(--dark);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 1.9rem; font-weight: 900; letter-spacing: -1px; }

        .nav-links button {
            background: none; border: none; color: white;
            margin-left: 30px; font-weight: 600; cursor: pointer;
        }

        .btn-cart {
            background: var(--accent);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .seccion { display: none; }
        .active { display: block; }

        /* HERO */
        #inicio {
            height: 85vh;
            background: linear-gradient(rgba(6,45,56,0.85), rgba(6,45,56,0.9)),
                        url('https://images.unsplash.com/photo-1558981403-c5f91cbba527?q=80&w=2070') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #inicio h1 { font-size: 4.5rem; font-weight: 900; margin-bottom: 1rem; }
        #inicio p { font-size: 1.4rem; max-width: 700px; margin-bottom: 2rem; }

        /* TIENDA */
        #tienda { padding: 60px 5%; background: var(--dark); }

        .catalog-container { display: flex; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .filters-sidebar { width: 260px; background: rgba(255,255,255,0.05); padding: 25px; border-radius: 16px; height: fit-content; position: sticky; top: 100px; }
        .category-chip { padding: 12px 18px; margin: 6px 0; background: rgba(255,255,255,0.08); border-radius: 8px; cursor: pointer; }
        .category-chip.active, .category-chip:hover { background: var(--accent); color: white; }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: #0A3D4A;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.4s;
        }
        .card:hover { transform: translateY(-8px); }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-content { padding: 18px; }
        .price { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
        .btn-add {
            background: var(--accent);
            color: white; border: none;
            width: 45px; height: 45px;
            border-radius: 10px; font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">STRIKE MOTARDS</div>
    <div class="nav-links">
        <button onclick="mostrarSeccion('inicio')">INICIO</button>
        <button onclick="mostrarSeccion('tienda')">CATÁLOGO</button>
        <button class="btn-cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<!-- CARRITO ESTILO FIGMA -->
<div id="cart-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; align-items: center; justify-content: center;">
    <div style="background: #062D38; width: 95%; max-width: 1100px; height: 85vh; border-radius: 16px; display: flex; overflow: hidden;">
        
        <!-- Izquierda: Lista de productos -->
        <div style="flex: 2; padding: 30px; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2>Carrito de Compras</h2>
                <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
            </div>
            <div id="cart-list"></div>
        </div>

        <!-- Derecha: Resumen -->
        <div style="flex: 1; background: #0A3D4A; padding: 30px; display: flex; flex-direction: column;">
            <h2>Resumen del Pedido</h2>
            
            <div style="margin-top: 40px; flex-grow: 1;">
                <div style="display:flex; justify-content:space-between; margin:15px 0;">
                    <span>Subtotal</span>
                    <span id="subtotal">$0</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin:15px 0;">
                    <span>Envío</span>
                    <span style="color:#00ff9d;">Gratis</span>
                </div>
            </div>

            <div style="border-top:2px solid #1a4d5c; padding-top:20px;">
                <div style="display:flex; justify-content:space-between; font-size:1.5rem; font-weight:700;">
                    <span>Total</span>
                    <span id="cart-total" style="color:var(--accent);">$0</span>
                </div>
            </div>

            <button onclick="showCheckout()" style="width:100%; margin-top:30px; padding:16px; background:var(--accent); border:none; color:white; font-weight:700; border-radius:12px; font-size:1.1rem;">
                Proceder al Pago
            </button>
        </div>
    </div>
</div>

<!-- HERO -->
<div id="inicio" class="seccion active">
    <h1>SIENTE LA VELOCIDAD</h1>
    <p>Equipamiento de alto rendimiento para el asfalto.</p>
    <button onclick="mostrarSeccion('tienda')" style="padding:16px 40px; background:var(--accent); border:none; border-radius:50px; color:white; font-size:1.1rem; cursor:pointer;">
        EXPLORAR TIENDA
    </button>
</div>

<!-- TIENDA -->
<div id="tienda" class="seccion">
    <h1 style="text-align:center; font-size:2.8rem; margin-bottom:10px;">CATÁLOGO PREMIUM</h1>
    <p style="text-align:center; color:#aaa; margin-bottom:40px;">Equipamiento profesional para motards</p>

    <div class="catalog-container">
        <div class="filters-sidebar">
            <h3 style="color:var(--teal);">Categorías</h3>
            <div id="category-filters"></div>
        </div>

        <div style="flex:1">
            <input type="text" id="search-input" placeholder="Buscar productos..." 
                   style="width:100%; padding:15px; background:#0A3D4A; border:none; border-radius:12px; color:white; margin-bottom:30px;">
            <div class="products-grid" id="lista-productos"></div>
        </div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
