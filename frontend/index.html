<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Motards | Premium Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A4D5C; 
            --primary-dark: #083B47;
            --accent: #FF3B3B;  
            --accent-hover: #E63535;
            --white: #ffffff;
            --zinc-300: #d4d4d8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--primary); 
            color: var(--white);
            margin: 0; 
            scroll-behavior: smooth;
        }

        nav {
            background: rgba(10, 77, 92, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { 
            font-size: 1.6rem; 
            font-weight: 900; 
            letter-spacing: -1px;
            cursor: pointer;
        }

        .nav-links button { 
            background: none; border: none; color: var(--white); 
            margin-left: 20px; font-weight: 600; cursor: pointer;
        }

        .btn-cart { 
            background: var(--accent) !important; 
            padding: 8px 18px; 
            border-radius: 50px; 
            color: white; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .seccion { display: none; min-height: 80vh; padding-top: 20px; }
        .active { display: block; }

        /* ==================== TIENDA MEJORADA ==================== */
        #tienda {
            padding: 40px 5%;
        }

        .tienda-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .catalog-container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filters-sidebar {
            width: 260px;
            background: var(--primary-dark);
            padding: 25px;
            border-radius: 16px;
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--primary-dark);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { 
            transform: scale(1.03); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
        }

        .card img { 
            width: 100%; 
            height: 260px; 
            object-fit: cover; 
        }

        .card-content { padding: 20px; }

        .category-badge {
            background: rgba(255, 59, 59, 0.15);
            color: var(--accent);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .price { 
            font-size: 1.7rem; 
            font-weight: 800; 
            color: var(--white); 
        }

        .btn-add-circle {
            background: var(--accent);
            color: white; 
            border: none;
            width: 48px; 
            height: 48px;
            border-radius: 12px; 
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add-circle:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .loading-msg, .no-results {
            text-align: center; 
            grid-column: 1/-1; 
            padding: 80px 20px; 
            font-size: 1.1rem;
            color: var(--zinc-300);
        }

        /* Filtros */
        .category-chip {
            display: block;
            padding: 12px 16px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-chip:hover,
        .category-chip.active {
            background: var(--accent);
            color: white;
        }

        #search-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary-dark);
            color: white;
            font-size: 1rem;
        }

        @media (max-width: 900px) {
            .catalog-container {
                flex-direction: column;
            }
            .filters-sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="mostrarSeccion('inicio')">STRIKE MOTARDS</div>
    <div class="nav-links">
        <button onclick="mostrarSeccion('inicio')">INICIO</button>
        <button onclick="mostrarSeccion('tienda')">TIENDA</button>
        <button class="btn-cart" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
    </div>
</nav>

<!-- Carrito (sin cambios) -->
<div id="cart-modal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">Tu Equipo</h2>
        <button onclick="toggleCart()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">✕</button>
    </div>
    <div id="cart-list" style="margin-top: 20px;"></div>
    <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 1.2rem;">
            <span>Total:</span>
            <span style="font-weight: 800; color: var(--accent);">$<span id="cart-total">0.00</span></span>
        </div>
        <button class="btn-checkout" onclick="sendWhatsApp()">FINALIZAR POR WHATSAPP</button>
    </div>
</div>

<!-- Secciones -->
<div id="inicio" class="seccion active">
    <h2>SIENTE LA VELOCIDAD</h2>
    <p style="font-size: 1.2rem; margin-bottom: 30px; opacity: 0.8;">Equipamiento de alto rendimiento para el asfalto.</p>
    <button class="btn-checkout" style="width: 250px;" onclick="mostrarSeccion('tienda')">EXPLORAR TIENDA</button>
</div>

<div id="tienda" class="seccion">
    <div class="tienda-header">
        <h1 style="font-size: 2.8rem;">CATÁLOGO PREMIUM</h1>
        <p style="color: var(--zinc-300);">Equipamiento profesional para motards</p>
    </div>

    <div class="catalog-container">
        <!-- Filtros Sidebar -->
        <div class="filters-sidebar">
            <h3 style="margin-bottom: 15px; color: var(--accent);">Categorías</h3>
            <div id="category-filters"></div>
            
            <h3 style="margin: 25px 0 15px; color: var(--accent);">Buscar</h3>
            <input type="text" id="search-input" placeholder="Buscar productos...">
        </div>

        <!-- Productos -->
        <div style="flex: 1;">
            <div class="products-grid" id="lista-productos">
                <!-- Cargado por JS -->
            </div>
        </div>
    </div>
</div>

<script src="index.js"></script>

<script>
    function mostrarSeccion(id) {
        document.getElementById('cart-modal').style.display = 'none';
        document.querySelectorAll('.seccion').forEach(sec => sec.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);

        if(id === 'tienda' && typeof cargarProductos === 'function') {
            cargarProductos();
        }
    }

    function toggleCart() {
        const cart = document.getElementById('cart-modal');
        cart.style.display = cart.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
